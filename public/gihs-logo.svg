<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&amp;family=Rajdhani:wght@700;800&amp;display=swap');
      .gihs-font-main {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
      }
      .gihs-font-sub {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        letter-spacing: 0.12em;
      }
      .gihs-font-tagline {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        letter-spacing: 0.14em;
      }
    </style>

    <!-- Electric Cyan to Deep Tech Blue Gradient -->
    <linearGradient id="gihsElectricCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#00A6FC" />
      <stop offset="100%" stop-color="#0062FC" />
    </linearGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="gihsShieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#00A6FC" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0048DE" stop-opacity="0.4" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="gihsNeonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="emblemBgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#08285C" />
      <stop offset="70%" stop-color="#020E24" />
      <stop offset="100%" stop-color="#010816" />
    </radialGradient>
  </defs>

  <!-- High-Tech Cyber Shield Emblem -->
  <g transform="translate(12, 10)">
    <!-- Outer Shield / Hex Silhouette -->
    <path 
      d="M 44 4 L 78 18 L 78 56 C 78 72 44 88 44 88 C 44 88 10 72 10 56 L 10 18 Z" 
      fill="url(#emblemBgGrad)" 
      stroke="url(#gihsShieldBorder)" 
      stroke-width="2.5" 
      stroke-linejoin="round"
    />

    <!-- Inner Cyber Circuit Traces & Geometry -->
    <path 
      d="M 44 14 L 68 24 L 68 52 C 68 64 44 76 44 76 C 44 76 20 64 20 52 L 20 24 Z" 
      fill="none" 
      stroke="#00A6FC" 
      stroke-width="1.2" 
      stroke-opacity="0.35" 
      stroke-dasharray="3 3"
    />

    <!-- Stylized Geometric Cyber 'G' / Core Emblem Crest -->
    <path 
      d="M 58 32 L 34 32 C 30 32 27 35 27 39 L 27 55 C 27 59 30 62 34 62 L 56 62 C 60 62 63 59 63 55 L 63 46 L 45 46 L 45 51 L 55 51 L 55 54 L 35 54 L 35 40 L 58 40 Z" 
      fill="url(#gihsElectricCyan)"
    />

    <!-- Glowing Cyber Nodes -->
    <circle cx="63" cy="46" r="3.5" fill="#00F0FF" filter="url(#gihsNeonGlow)" />
    <circle cx="34" cy="32" r="2.5" fill="#FFFFFF" />
    <circle cx="56" cy="62" r="2.5" fill="#00F0FF" />
    <circle cx="44" cy="22" r="2" fill="#00A6FC" />
  </g>

  <!-- Wordmark: GIHS -->
  <text 
    x="108" 
    y="60" 
    font-size="50" 
    fill="#FFFFFF" 
    class="gihs-font-main" 
    letter-spacing="0.01em"
  >GIHS</text>

  <!-- Wordmark: SYSTEMS (na cor ciano elétrico vibrante) -->
  <text 
    x="236" 
    y="60" 
    font-size="44" 
    fill="url(#gihsElectricCyan)" 
    class="gihs-font-sub"
  >SYSTEMS</text>

  <!-- Tagline Corporativa Oficial: abaixo da logo, na mesma cor ciano (#00A6FC) -->
  <text 
    x="110" 
    y="86" 
    font-size="11" 
    fill="#00A6FC" 
    class="gihs-font-tagline"
  >Enterprise System . 100% Monitorado</text>
</svg>
